name: Desplegar en GitHub Pages

# Cada push a main publica la carpeta app/ en la web.
on:
  push:
    branches: [main]
  workflow_dispatch:          # y también a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si se acumulan varios pushes, solo interesa publicar el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Le pone el sello del commit a cada URL interna (?v=abc1234). Sin esto,
      # GitHub Pages sirve los ficheros con diez minutos de caché y el navegador
      # se queda con los módulos viejos durante horas: en el ordenador se arregla
      # con Ctrl+Shift+R, pero en un móvil no hay Ctrl+Shift+R. Se hace sobre la
      # copia que se publica y nunca sobre los fuentes.
      - name: Sellar las URLs con el commit
        run: node app/herramientas/sellar.mjs app "${{ github.sha }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: despliegue
        uses: actions/deploy-pages@v4
