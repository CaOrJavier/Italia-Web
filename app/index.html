<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#8c2f22">
<meta name="description" content="Guía interactiva y offline del viaje a Italia del 14 al 25 de agosto de 2026.">
<title>Italia 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="arranque" class="arranque">
  <div class="arranque-marca">Italia<span>2026</span></div>
  <p id="arranque-msg">Cargando el viaje…</p>
</div>

<header class="cabecera" id="cabecera" hidden>
  <div class="pestanas">
    <a class="pestana" id="pestana-alt" href="#/alternativas" data-ruta="alternativas" title="Alternativas al itinerario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6.5a4 4 0 0 1 4 4v7"/><path d="M4 17h6.5a4 4 0 0 0 4-4V6"/><path d="M17.5 3.5 21 7l-3.5 3.5"/><path d="M17.5 14.5 21 18l-3.5 3.5"/></svg>
      <span>Alternativas</span>
    </a>
    <a class="pestana" id="pestana-idioma" href="#/idioma" data-ruta="idioma" title="Idioma: pronunciación y frases">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h9M8 3.5v2M10.5 5.5c0 4-3 7.5-7 9"/><path d="M6 9.5c1.2 2.4 3 4 5.5 5"/><path d="M12.5 20.5l4-11 4 11M14 17h5"/></svg>
      <span>Idioma</span>
    </a>
  </div>
  <div class="cabecera-txt">
    <span class="cabecera-sup" id="cab-sup">Italia en coche</span>
    <h1 class="cabecera-tit" id="cab-tit">Hoy</h1>
  </div>
  <button class="btn-icono" id="btn-ajustes" aria-label="Ajustes" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
  </button>
</header>

<main id="vista" class="vista" tabindex="-1" hidden></main>

<button class="fab" id="fab-gasto" hidden aria-label="Anotar un gasto">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span>Gasto</span>
</button>

<nav class="nav" id="nav" hidden aria-label="Secciones">
  <a class="nav-item" href="#/hoy" data-ruta="hoy">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2M5.8 9.6V20h12.4V9.6"/></svg>
    <span>Hoy</span>
  </a>
  <a class="nav-item" href="#/ruta" data-ruta="ruta">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 20V8.5a3 3 0 0 1 3-3h5a3 3 0 0 0 3-3"/><circle cx="6.5" cy="20" r="1.9"/><circle cx="17.5" cy="2.5" r="1.9"/><path d="M9.5 12.5h9"/></svg>
    <span>Ruta</span>
  </a>
  <a class="nav-item" href="#/mapa" data-ruta="mapa">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6.2v13.3L9 17.3l6 2.4 5.5-2.2V4.2L15 6.4z"/><path d="M9 4v13.3M15 6.4v13.3"/></svg>
    <span>Mapa</span>
  </a>
  <a class="nav-item" href="#/gasto" data-ruta="gasto">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 19.5V11M9 19.5V6M14.5 19.5v-6M20 19.5V4"/></svg>
    <span>Gasto</span>
  </a>
  <a class="nav-item" href="#/guia" data-ruta="guia">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5h9a3 3 0 0 1 3 3v12a2.4 2.4 0 0 0-2.4-2.4H4.5z"/><path d="M19.5 4.5v14.6"/></svg>
    <span>Guía</span>
  </a>
</nav>

<div class="hoja-fondo" id="hoja-fondo" hidden></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-tit" hidden>
  <div class="hoja-agarre" aria-hidden="true"></div>
  <div class="hoja-cab">
    <h2 id="hoja-tit"></h2>
    <button class="btn-icono" id="hoja-cerrar" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</div>

<div class="aviso-flotante" id="aviso-flotante" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
